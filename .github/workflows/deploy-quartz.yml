name: Deploy Obsidian Vault with Quartz 5

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private vault
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Quartz 5
        run: |
          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git quartz-site

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quartz-site/package-lock.json

      - name: Prepare Quartz configuration
        shell: bash
        run: |
          cd quartz-site
          cp quartz.config.default.yaml quartz.config.yaml
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("quartz.config.yaml")
          s = p.read_text(encoding="utf-8")

          s = s.replace("pageTitle: Quartz 5", 'pageTitle: "Frozen / 饮茶室"', 1)
          s = s.replace("locale: en-US", "locale: zh-CN", 1)
          s = s.replace("baseUrl: quartz.jzhao.xyz", "baseUrl: Justin62628.github.io/FrozenProjects", 1)
          s = s.replace("defaultDateType: modified", "defaultDateType: created", 1)

          pattern = r'(?m)^(\s*-\s*source:\s*["\']?(?:@quartz-community/og-image|github:quartz-community/og-image)["\']?\s*\n)(\s*enabled:\s*)true\s*$'
          s, count = re.subn(pattern, r'\1\2false', s, count=1)
          if count != 1:
              raise SystemExit("Failed to locate and disable Quartz og-image plugin")

          p.write_text(s, encoding="utf-8")
          PY

          echo "Quartz OG image config:"
          grep -A1 -E 'source:.*(og-image)' quartz.config.yaml
          if grep -A1 -E 'source:.*(og-image)' quartz.config.yaml | grep -q 'enabled: true'; then
            echo "ERROR: og-image plugin is still enabled"
            exit 1
          fi

      - name: Import vault root as Quartz content
        shell: bash
        run: |
          rm -rf quartz-site/content/*

          # Publish notes and common attachment types only. Tooling/scripts remain private.
          rsync -a --prune-empty-dirs \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.obsidian/' \
            --exclude='**/_source/' \
            --exclude='**/_extract/' \
            --include='*/' \
            --include='*.md' \
            --include='*.png' \
            --include='*.jpg' \
            --include='*.jpeg' \
            --include='*.webp' \
            --include='*.gif' \
            --include='*.svg' \
            --include='*.pdf' \
            --include='*.mp3' \
            --include='*.mp4' \
            --exclude='*' \
            ./ quartz-site/content/

          # Map the Vault README to the site root.
          if [ -f quartz-site/content/README.md ]; then
            cp quartz-site/content/README.md quartz-site/content/index.md
            rm quartz-site/content/README.md
          fi

      - name: Inject 出处时间 as created date
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          content = Path("quartz-site/content")
          injected = 0
          skipped = []
          for p in sorted(content.rglob("*.md")):
              txt = p.read_text(encoding="utf-8")
              if not txt.startswith("---"):
                  continue
              m = re.match(r"^---\n(.*?)\n---\n", txt, re.S)
              if not m:
                  continue
              fm = m.group(1)
              if re.search(r"(?m)^created:", fm):
                  continue
              ts = re.search(r"(?m)^time_start:\s*(.+)$", fm)
              if not ts:
                  skipped.append(str(p.relative_to(content)))
                  continue
              val = ts.group(1).strip().strip('"').strip("'")
              date_part = val[:10]
              if not re.match(r"^\d{4}-\d{2}-\d{2}$", date_part):
                  skipped.append(str(p.relative_to(content)))
                  continue
              new_fm = fm + f"\ncreated: {date_part}"
              txt = txt[:m.start(1)] + new_fm + txt[m.end(1):]
              p.write_text(txt, encoding="utf-8")
              injected += 1
          print(f"injected created date into {injected} notes")
          if skipped:
              print(f"skipped {len(skipped)} notes without time_start:")
              for s in skipped:
                  print("  -", s)
          PY

      - name: Install Quartz dependencies and plugins
        working-directory: quartz-site
        run: |
          npm ci
          npx quartz plugin install --from-config

      - name: Build Quartz site
        working-directory: quartz-site
        run: npx quartz build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
